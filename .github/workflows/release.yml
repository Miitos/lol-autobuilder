name: Release

# Un tag vX.Y.Z (identique à la version de pyproject.toml) construit l'installateur et l'exe portable
# (un seul fichier, mis à jour depuis l'appli) sur Windows, puis publie la release GitHub. Lancé à la main, il construit seulement (artefacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -e ".[dev,build]"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version de pyproject.toml"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: python -m pytest -q

      - name: Exe en dossier (PyInstaller, pour l'installateur)
        run: pyinstaller --noconfirm --clean packaging/lolbuilds.spec

      - name: Exe portable (PyInstaller, un seul fichier)
        run: pyinstaller --noconfirm --clean packaging/lolbuilds-portable.spec

      # Lance les exe construits : la couche fenêtre (pywebview + pythonnet) doit se charger, sinon la release
      # n'est pas publiée (c'est l'import qui plantait au démarrage de la version portable).
      - name: Les exe démarrent
        shell: pwsh
        run: |
          foreach ($exe in "dist\lolbuilds\lolbuilds.exe", "dist\lolbuilds-portable.exe") {
            $p = Start-Process $exe -ArgumentList "--check-gui" -Wait -PassThru
            $report = Join-Path $env:TEMP "lolbuilds-check-gui.txt"
            if ($p.ExitCode -ne 0) {
              if (Test-Path $report) { Get-Content $report }
              Write-Error "$exe : la fenêtre ne se charge pas (code $($p.ExitCode))"
              exit 1
            }
            Remove-Item $report -ErrorAction SilentlyContinue
          }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fichiers de la release et empreintes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\installer\lolbuilds-setup-$v.exe" release\
          Copy-Item dist\lolbuilds-portable.exe "release\lolbuilds-portable-$v.exe"
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: lolbuilds-${{ steps.version.outputs.version }}
          path: release/*

      - name: Release GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem release -File).FullName `
            --title "lolbuilds ${{ steps.version.outputs.version }}" --notes-file packaging/RELEASE_NOTES.md
