[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolbuilds"
version = "0.5.5"
description = "Import automatique de builds LoL (runes, sorts, item set) en champ select, depuis un cache local rempli la nuit via OP.GG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]  # exe Windows : pyinstaller packaging/lolbuilds.spec

[project.scripts]
lolbuilds-prefetch = "lolbuilds.prefetch:main"
lolbuilds-app = "lolbuilds.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lolbuilds.app" = ["ui/*", "ui/fonts/*", "ui/audio/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
